name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # secrets can't be referenced directly in step `if:` conditions, so
      # resolve it to a plain env var first.
      HAS_SERVICE_ROLE_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx tsc -b

      # Same public-safe values already committed in wrangler.jsonc `vars` —
      # Vite needs them at build time to bake into the client bundle, and
      # CI has no .env.local (correctly gitignored), so they must be set here.
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: https://yfsoxbcqmyzddqtqiuzj.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_IP4YtYFLbFAg6d24_GzPcw_NHXlfGsl

      # Deploy always proceeds even if the service-role secret isn't set yet —
      # the site itself should stay reachable; only /api/* calls that need
      # Supabase admin access will fail until SUPABASE_SERVICE_ROLE_KEY exists.
      - name: Deploy (with service-role secret)
        if: ${{ env.HAS_SERVICE_ROLE_SECRET == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy (service-role secret not yet configured)
        if: ${{ env.HAS_SERVICE_ROLE_SECRET == 'false' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
