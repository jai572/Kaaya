name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx tsc -b

      - run: npx vite build

      # Deploy always proceeds even if the service-role secret isn't set yet —
      # the site itself should stay reachable; only /api/* calls that need
      # Supabase admin access will fail until SUPABASE_SERVICE_ROLE_KEY exists.
      - name: Deploy (with service-role secret)
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy (service-role secret not yet configured)
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY == '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
