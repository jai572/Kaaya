<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#054a76" />
  <title>Kaaya | Brow Bar, Threading, Lashes & Nails in Aberdeen</title>
  <meta
    name="description"
    content="Kaaya is an established brow and beauty studio at Bon Accord Shopping Centre in Aberdeen, offering threading, tinting, waxing, lashes, henna and nails."
  />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!--
    Static (site-wide, not per-route) social-share metadata. useSeo overwrites
    og:title/og:description/canonical per route once JS runs, but that update
    never reaches social unfurl bots (Slack, WhatsApp, iMessage, Facebook,
    LinkedIn) - none of them execute JS, they only read this raw HTML. So
    every share of any page falls back to these Kaaya-wide defaults rather
    than showing nothing.
  -->
  <meta property="og:site_name" content="Kaaya" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kaaya.jb-38f.workers.dev/" />
  <meta property="og:title" content="Kaaya | Brow Bar, Threading, Lashes & Nails in Aberdeen" />
  <meta
    property="og:description"
    content="Kaaya is an established brow and beauty studio at Bon Accord Shopping Centre in Aberdeen, offering threading, tinting, waxing, lashes, henna and nails."
  />
  <meta property="og:image" content="https://kaaya.jb-38f.workers.dev/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kaaya | Brow Bar, Threading, Lashes & Nails in Aberdeen" />
  <meta
    name="twitter:description"
    content="Kaaya is an established brow and beauty studio at Bon Accord Shopping Centre in Aberdeen, offering threading, tinting, waxing, lashes, henna and nails."
  />
  <meta name="twitter:image" content="https://kaaya.jb-38f.workers.dev/og-image.jpg" />

  <!--
    LocalBusiness structured data - only verified facts from the Kaaya
    leaflet/Facebook page. No openingHours (not supplied) or priceRange
    (leaflet prices don't map cleanly to schema.org's $ / ££ convention) -
    omitted rather than guessed.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BeautySalon",
      "name": "Kaaya",
      "image": "https://kaaya.jb-38f.workers.dev/og-image.jpg",
      "url": "https://kaaya.jb-38f.workers.dev/",
      "telephone": "+447378454500",
      "email": "info@kaaya-clinic.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Bon Accord Shopping Centre",
        "addressLocality": "Aberdeen",
        "addressCountry": "GB"
      },
      "sameAs": ["https://facebook.com/eye.brow.threading.aberdeen"]
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    Real content for anything that fetches HTML without running JS - search
    crawlers that don't render, link-preview bots, and tools like ChatGPT's
    browser, which only reads markup. The React app replaces/hides this the
    instant it mounts; nothing here duplicates visibly for a real visitor.
  -->
  <noscript>
    <div style="max-width:640px;margin:40px auto;padding:20px;font-family:sans-serif;line-height:1.6;">
      <h1>Kaaya - Brow Bar, Aberdeen</h1>
      <p>
        We are an established Brow Bar in Aberdeen, highly experienced in all aspects of
        Threading - an ancient art of eyebrow shaping and unwanted hair removal - and we aim to
        satisfy all your hair &amp; beauty needs. We provide treatments for facial threading,
        eyebrow/eyelash tinting, eyelash extensions, face waxing, manicure/pedicure and henna
        body tattoos.
      </p>
      <p>We are conveniently located right in the middle of Aberdeen city-centre shopping mall, Bon Accord.</p>
      <p>
        Phone: <a href="tel:+447378454500">07378 454500</a> &middot;
        Email: <a href="mailto:info@kaaya-clinic.com">info@kaaya-clinic.com</a> &middot;
        Bon Accord Shopping Centre, Aberdeen
      </p>
    </div>
  </noscript>
  <!--
    Plain-JS safety net, outside React entirely: if the module script below
    throws during load (e.g. a missing build-time env var) or hangs, React
    never mounts and #root stays empty with nothing in the console a
    non-technical person would see. A blank white page reads as "the site
    is down" with no way to know why - this at least says so.
  -->
  <script>
    (function () {
      var showFallback = function () {
        var root = document.getElementById("root");
        if (root && root.childElementCount === 0) {
          root.innerHTML =
            '<div style="max-width:480px;margin:40px auto;padding:20px;font-family:sans-serif;text-align:center;">' +
            "<h2>Kaaya is temporarily unavailable</h2>" +
            "<p>Please refresh the page. If this keeps happening, contact Kaaya directly.</p>" +
            "</div>";
        }
      };
      window.addEventListener("error", showFallback);
      window.addEventListener("unhandledrejection", showFallback);
      setTimeout(showFallback, 8000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
